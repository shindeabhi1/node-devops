name: DevSecOps CI Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  devsecops:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install dependencies
      run: npm install

    - name: Run tests
      run: npm test

    - name: SonarCloud Scan
      uses: SonarSource/sonarcloud-github-action@v2
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with:
        args: >
          -Dsonar.organization=shindeabhi1
          -Dsonar.projectKey=shindeabhi1_node-devops
          -Dsonar.sources=.

    - name: Build Docker image
      run: docker build -t node-devops-app .

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-south-1

    - name: Login to Amazon ECR
      run: |
        aws ecr get-login-password --region ap-south-1 |
        docker login --username AWS --password-stdin 887056859187.dkr.ecr.ap-south-1.amazonaws.com

    - name: Push Docker image to ECR
      run: |
        docker tag node-devops-app:latest 887056859187.dkr.ecr.ap-south-1.amazonaws.com/node-devops-app:latest
        docker push 887056859187.dkr.ecr.ap-south-1.amazonaws.com/node-devops-app:latest

    - name: Start application
      run: |
        npm start &
        sleep 15

    - name: OWASP ZAP Baseline Scan
      uses: zaproxy/action-baseline@v0.10.0
      with:
        target: http://localhost:3000
        fail_action: false
